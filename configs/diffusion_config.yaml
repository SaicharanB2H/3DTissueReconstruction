# ==============================================================================
# Conditional Latent Diffusion Configuration
# ==============================================================================

# Shared Slice Encoder + Positional Embedding
encoder:
  backbone: "resnet18" # "resnet18", "convnet", or "custom"
  in_channels: 1 # Matches modality in_channels
  pretrained: false # Trained from scratch on medical context
  pos_emb_dim: 64
  pos_emb_type: "fourier" # "fourier", "sinusoidal", "learned"
  out_context_dim: 256
  num_context_tokens: 16

# Conditional Denoising U-Net (operates on 30x30 VAE latents)
unet:
  in_channels: 4 # Latent channels from VAE
  out_channels: 4
  base_channels: 64
  channel_multipliers: [1, 2, 4] # Latent spatial sizes: 30x30 -> 15x15 -> 8x8
  num_res_blocks: 2
  attention_levels: [false, true, true]
  num_heads: 4
  norm_num_groups: 16
  context_dim: 256 # Cross-attention conditioning dimension
  conditioning_mode: "hybrid" # "cross_attn", "concat", or "hybrid" (cross_attn + concat)

# Diffusion Process & Sampling
diffusion:
  num_train_timesteps: 1000
  beta_schedule: "cosine" # "linear" or "cosine"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon" # Predicts noise \epsilon
  sampling_method: "ddim" # "ddim" or "ddpm"
  ddim_sampling_steps: 25 # Fast inference: 25 steps per missing slice
  ddim_eta: 0.0 # Deterministic sampling (eta=0.0)

# Training Hyperparameters
training:
  batch_size: 16
  lr: 2.0e-4
  weight_decay: 1.0e-4
  min_lr: 1.0e-6
  epochs: 50
  warmup_epochs: 3
  grad_clip_norm: 1.0
  mixed_precision: true # FP16 AMP
  ema_decay: 0.999
  use_ema: true
  checkpoint_dir: "./experiments/checkpoints/diffusion"
  vae_checkpoint: "./experiments/checkpoints/vae/best_model.pt"
