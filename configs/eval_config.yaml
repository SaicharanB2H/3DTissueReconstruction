# Corrected benchmark defaults. CLI controls output paths and patient count.
# Metrics are always PSNR/SSIM/MAE/MSE, both full-volume and missing-slice.
# Visualization and reconstruction export are separate commands.
evaluation:
  strides: [2, 4, 8, 16]
  baselines:
    - nearest
    - linear
    - cubic
    - smoothed_linear
